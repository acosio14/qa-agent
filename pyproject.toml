[project]
name = "qa-agent"
version = "0.1.0"
description = "A stateless one-shot Q&A CLI that answers questions about your files, docs, and notes."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Adrian Cosio", email = "adriancosio14@gmail.com" },
]
keywords = ["qa", "cli", "rag", "bm25", "llm", "openrouter"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "bm25s>=0.3.10",
    "dotenv>=0.9.9",
    "markitdown[docx,pdf]>=0.1.6",
    "numpy>=1.26",
    "openrouter>=0.11.22",
    "pydantic>=2.0",
]

[project.scripts]
qa-agent = "qa_agent_cli.main:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ty>=0.0.55",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_agent_cli"]

[tool.pytest.ini_options]
pythonpath = ["src"]
